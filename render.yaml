services:
  - type: web
    name: jonpeek-clippers-hub
    env: docker
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: clippers-data
      mountPath: /data
      sizeGB: 1
